version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: phantoms_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: PhantomsDb
      POSTGRES_USER: phantoms_user
      POSTGRES_PASSWORD: phantoms_pass
    ports:
      - "5432:5432"
    volumes:
      - phantoms_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phantoms_user -d PhantomsDb"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: phantoms_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@phantoms.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  phantoms_pgdata:
    driver: local
